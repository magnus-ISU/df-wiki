<div class="mw-parser-output"><p>Returns either yes or no based on if the input temperature (either a number value or NONE) is safe to dump in magma.
</p><p>For example:
</p><p><code>{{Magmasafe/test|10000}}</code> → <code>no</code>
</p><p><code>{{Magmasafe/test|12000}}</code> → <code>no</code>
</p><p><code>{{Magmasafe/test|14000}}</code> → <code>yes</code>
</p><p><code>{{Magmasafe/test|NONE}}</code> → <code>yes</code>
</p></div>
