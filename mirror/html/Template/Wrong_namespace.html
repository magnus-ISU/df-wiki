<div class="mw-parser-output"><p>Marks an incorrectly-namespaced page for deletion.
</p><p>Note that pages in an incorrect namespace should ideally be moved to the <b>correct</b> namespace before the original is tagged for deletion.
</p><p>Usage:
</p>
<pre>{{wrong namespace}}
</pre>
<p>or:
</p>
<pre>{{wrong namespace|<i>correct namespace</i>}}
</pre>
</div>
