<div class="mw-parser-output"><p>Use {{disambig}} to mark a page as a disambiguation page.
</p><p>If you want to include the default "<b>This page</b> can refer to..." message, use <code>|page=(any value)</code> after "disambig":
</p>
<pre>{{disambig|page=yes}}
</pre>
<p>Note that this template prevents rating pages by default. To allow ratings, use <code>|rate=yes</code>.
</p></div>
