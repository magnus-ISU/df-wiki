<div class="mw-parser-output"><h2><span class="mw-headline" id="Usage">Usage</span></h2>
<p>Defining a citation:
</p>
<pre>{{cite|name|source}}</pre>
<p>("source" can be either a page name or an external URL)
</p><p>Reusing a citation:
</p>
<pre>{{cite|name}}</pre>
<p>Citations can be redefined, but doing so will increase their ID (shown in superscript). Definitions only apply to citations that follow them.
</p></div>
