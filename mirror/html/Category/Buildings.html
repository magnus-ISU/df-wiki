<div class="mw-parser-output"><p>A <a href="/index.php/Building" title="Building">building</a> is a structure made by a sentient life-form out of raw or processed materials, which is operated in order to produce objects or otherwise perform work. Buildings include <a href="/index.php/Workshop" title="Workshop">workshops</a>, <a href="/index.php/Machine" class="mw-redirect" title="Machine">machines</a>, and the like.
</p><p>Buildings are distinct from <a href="/index.php/Room" title="Room">rooms</a>.
</p></div>
